<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Economy Master Interface v2.10.8</title><style>
:root{--line:#b9d5e4;--line2:#d6e7ef;--txt:#143044;--mut:#587384}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;font-family:Segoe UI,Arial,sans-serif;background:#dff0f8;color:var(--txt)}.app{height:100vh;display:grid;grid-template-rows:44px 112px 1fr 86px}.top{display:flex;justify-content:space-between;align-items:center;margin:6px 6px 0;padding:7px 12px;border:1px solid var(--line);border-radius:12px;background:#f8fdff}.title{font-size:20px;font-weight:900}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:white;margin-left:5px}.ribbon{display:grid;grid-template-rows:repeat(4,1fr);gap:4px;margin:5px 6px 0;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:#f6fcff}.row{display:grid;grid-template-columns:76px 1fr;gap:8px;align-items:center}.lab{font-size:10px;text-transform:uppercase;font-weight:900;letter-spacing:1px;color:#46687c}.buttons{display:flex;gap:7px;overflow:hidden}.btn{border:1px solid var(--line);background:white;border-radius:999px;padding:4px 12px;min-height:22px;font-size:11px;font-weight:800;cursor:pointer}.btn.active{background:linear-gradient(#25a2e6,#1174c2);color:white;border-color:#0f66a8}.btn.small{padding:4px 9px}.btn.red{background:#fff3f3;color:#9d1b1b}.btn.green{background:#f2fff7;color:#096438}.btn.orange{background:#fff8eb;color:#875300}.main{display:grid;grid-template-columns:330px 1fr 310px;gap:8px;min-height:0;margin:6px}.panel{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:0}.head{height:36px;display:flex;justify-content:space-between;align-items:center;padding:0 10px;border-bottom:1px solid var(--line2);font-weight:900}.filter{padding:8px;border-bottom:1px solid var(--line2)}.filter input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px}.tree{height:calc(100% - 170px);overflow:auto;padding:6px 8px}.ctx{height:98px;border-top:1px solid var(--line);background:#edf8fd;padding:8px;font-size:11px;line-height:1.6}.node{font-size:12px;line-height:22px;white-space:nowrap}.line{display:flex;gap:5px;align-items:center;border-radius:5px;padding:1px 3px;cursor:pointer}.line:hover{background:#eef8fd}.line.active{background:#d7effc;border:1px solid #a6d1e8}.tw{width:14px;text-align:center}.ico{width:16px}.meta{margin-left:auto;color:#8ba0ad;font-size:9px}.kids{margin-left:17px;border-left:1px dotted #c8dde8;padding-left:8px}.rank{font-size:10px;color:#fff;background:#125e86;border-radius:999px;padding:1px 6px}.center{display:grid;grid-template-rows:36px 37px 1fr}.crumb{display:flex;align-items:center;padding:0 10px;border-bottom:1px solid var(--line2);background:white;font-size:12px;font-weight:900;text-transform:uppercase}.actions{display:flex;gap:7px;align-items:center;padding:5px 8px;border-bottom:1px solid var(--line2);background:#fbfeff}.work{overflow:auto;padding:14px;background:linear-gradient(rgba(21,83,116,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(21,83,116,.055) 1px,transparent 1px),white;background-size:20px 20px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:330px 1fr;gap:14px}.diagram{display:grid;grid-template-rows:auto auto 1fr auto 1fr auto;justify-items:center;align-items:center;height:430px;border:2px solid #111;background:#fff;padding:8px}.big{font-size:22px;font-weight:900;text-align:center}.arrow{font-size:112px;line-height:.8}.treeword{font-size:21px;font-weight:900;text-align:center}.table{width:100%;border-collapse:collapse;font-size:12px;background:white}.table th{position:sticky;top:0;background:#eaf5fb;border:1px solid var(--line);padding:7px;text-align:left;cursor:pointer}.table td{border:1px solid var(--line2);padding:7px}.profile{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{border:1px solid var(--line);border-radius:10px;padding:10px;background:white}.inspect{display:grid;grid-template-rows:36px 1fr 92px}.body{overflow:auto;padding:10px}.props{width:100%;border-collapse:collapse;font-size:11px}.props td{border:1px solid var(--line2);padding:6px}.props td:first-child{font-weight:900;background:#f2f8fb}.foot{border-top:1px solid var(--line);padding:8px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.bottom{display:grid;grid-template-columns:1.1fr 1.4fr 1.4fr;gap:6px;margin:0 6px 6px}.stream{font-size:11px;padding:6px 8px;line-height:1.5;overflow:auto;height:calc(100% - 36px)}.ok{color:#08763b}.warn{color:#a05b00}
</style></head><body><div class='app'><div class='top'><div class='title' id='appTitle'>Economy Master Interface v2.10.8 Workspace</div><div><span class='tag'>Human Needs Priority Tree</span><span class='tag'>Sortable Comparator Datagrid</span><span class='tag'>Modular JSON</span></div></div><div class='ribbon' id='ribbon'></div><div class='main'><aside class='panel'><div class='head'><div>Contextual TreeView <span id='nodeCount' class='meta'></span></div><div><button class='btn small' id='collapseBtn'>−</button><button class='btn small' id='expandBtn'>+</button></div></div><div class='filter'><input id='filter' placeholder='Filter current tree...'></div><div class='tree' id='tree'></div><div class='ctx' id='ctx'></div></aside><main class='panel center'><div class='crumb' id='crumb'></div><div class='actions'><button class='btn small' id='openNeeds'>Open Needs Tree</button><button class='btn small' id='openGrid'>Open Sortable Datagrid</button><button class='btn small green' id='export'>Export Workspace</button><button class='btn small' id='expandSources'>Expand Source Data</button><button class='btn small' id='clear'>Clear Selection</button></div><div class='work' id='work'></div></main><aside class='panel inspect'><div class='head'>Selected Item Inspector</div><div class='body' id='inspector'></div><div class='foot'><button class='btn small'>NEW</button><button class='btn small'>EDIT</button><button class='btn small'>SAVE</button></div></aside></div><div class='bottom'><div class='panel'><div class='head'>Selected Summary / Stats</div><div class='stream' id='summary'></div></div><div class='panel'><div class='head'>Economic Event Bus / VRQ Queue</div><div class='stream' id='events'></div></div><div class='panel'><div class='head'>Evidence / Records / Outcomes</div><div class='stream' id='evidence'></div></div></div></div><script>
const state={sector:'Human / Consumer',mode:'Swimlane',scope:'Personal',overlay:'Law / Rights / Regulation',selectedId:'human_needs',expanded:new Set(['home','human','human_needs']),sortField:'need_rank',sortAsc:true};let ribbon={},nodes=[],sources=[],records=[],cols=[],tree=null;
async function j(p,f){try{let r=await fetch(p,{cache:'no-store'});if(!r.ok)throw 0;return await r.json()}catch(e){return f}}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function build(ns){let by={};ns.forEach(n=>by[n.node_id]={...n,children:[]});let root=null;ns.forEach(n=>{if(n.parent_id&&by[n.parent_id])by[n.parent_id].children.push(by[n.node_id]);else root=by[n.node_id]});Object.values(by).forEach(n=>n.children.sort((a,b)=>(a.sort||0)-(b.sort||0)||a.label.localeCompare(b.label)));return root}
function find(id,n=tree,p=[]){if(!n)return null;if(n.node_id===id)return{n,path:[...p,n]};for(let c of n.children||[]){let r=find(id,c,[...p,n]);if(r)return r}return null}function sel(){return find(state.selectedId)?.n||tree}function cnt(n=tree){return n?1+(n.children||[]).reduce((a,c)=>a+cnt(c),0):0}
function render(){renderRibbon();renderTree();renderWork();renderInspector();renderBottom()}function renderRibbon(){let rows=[['Sectors','sectors','sector'],['Scope','scopes','scope'],['Overlays','overlays','overlay'],['Tools','tools','mode']];document.getElementById('ribbon').innerHTML=rows.map(([l,k,kind])=>`<div class='row'><div class='lab'>${l}</div><div class='buttons'>${(ribbon[k]||[]).map(v=>`<button class='btn ${state[kind]===v?'active':''}' data-kind='${kind}' data-val='${esc(v)}'>${esc(v)}</button>`).join('')}</div></div>`).join('');document.querySelectorAll('#ribbon button').forEach(b=>b.onclick=()=>{state[b.dataset.kind]=b.dataset.val;if(b.dataset.kind==='sector'){let m={'Home':'home','Human / Consumer':'human_needs','Market / Exchange':'market','Business / Commercial':'business','Finance / Capital':'finance_sector','Public / Government':'government'}[state.sector];if(m){state.selectedId=m;state.expanded.add('home');state.expanded.add(m);if(m==='human_needs')state.expanded.add('human')}}render()})}
function icon(n){return {'priority-root':'↓','need-domain':'◆','need-fulfillment-class':'◇','source':'◫','source-group':'▤','profile':'☻','sector-link':'◦'}[n.type]||'□'}function renderTree(){document.getElementById('nodeCount').textContent=cnt()+' nodes';let f=document.getElementById('filter').value.toLowerCase(),h=[];function walk(n,d=0){if(f&&!JSON.stringify(n).toLowerCase().includes(f))return;let has=(n.children||[]).length,open=state.expanded.has(n.node_id)||f,act=n.node_id===state.selectedId;h.push(`<div class='node'><div class='line ${act?'active':''}' data-id='${n.node_id}' style='margin-left:${d*2}px'><span class='tw'>${has?(open?'−':'▸'):'·'}</span><span class='ico'>${icon(n)}</span>${n.priority_rank?`<span class='rank'>${n.priority_rank}</span>`:''}<span>${esc(n.label.replace(/^\d+\.\s*/,''))}</span><span class='meta'>${esc(n.meta||n.type||'')}</span></div>`);if(has&&open){h.push('<div class=kids>');n.children.forEach(c=>walk(c,d+1));h.push('</div>')}h.push('</div>')}walk(tree);document.getElementById('tree').innerHTML=h.join('');document.querySelectorAll('.line').forEach(x=>x.onclick=e=>{let id=x.dataset.id;if(e.target.className==='tw'){state.expanded.has(id)?state.expanded.delete(id):state.expanded.add(id)}else{state.selectedId=id;let n=sel();if(n.sector)state.sector=n.sector;state.expanded.add(id)}render()})}
function renderWork(){let n=sel(),path=find(state.selectedId)?.path.map(x=>x.label).join(' / ')||'';document.getElementById('crumb').textContent=path.toUpperCase();let w=document.getElementById('work');if(state.mode==='Datagrid'||state.mode==='Compare / Transact'){w.innerHTML=gridView(n);return}if(state.mode==='User Profile'){w.innerHTML=`<div class=card><h2>User Profile Lens</h2><p>User profile weights and constraints are applied over the selected need. It is not duplicate tree structure.</p><div class=profile><div class=mini><b>Need weights</b><ul><li>Survival priority</li><li>User urgency</li><li>Current gap</li></ul></div><div class=mini><b>Constraints</b><ul><li>Budget</li><li>Location</li><li>Time</li></ul></div><div class=mini><b>Selected</b><ul><li>${esc(n.label)}</li><li>${esc(n.description||'')}</li></ul></div></div></div>`;return}if(n.type==='priority-root'||n.type==='need-domain'||n.type==='need-fulfillment-class'){w.innerHTML=needsView(n);return}w.innerHTML=`<div class=card><h2>${esc(n.label)}</h2><p>Context: <b>${esc(state.sector)}</b> × <b>${esc(state.scope)}</b> × <b>${esc(state.overlay)}</b> × <b>${esc(state.mode)}</b>.</p></div>`}
function needsView(n){return `<div class=grid><div class=diagram><div class=big>LIST USER<br>WANTS / NEEDS</div><div>MOST IMPORTANT</div><div class=arrow>↓</div><div class=treeword>HIERARCHICAL<br>TREEVIEW</div><div class=arrow>↓</div><div>LEAST IMPORTANT</div></div><div><div class=card><h2>${esc(n.label)}</h2><p>This TreeView is ordered by human need priority. It is not merely a product taxonomy.</p><p><b>Description:</b> ${esc(n.description||'Choose a need branch to identify what fulfills it.')}</p></div><div class=card><h3>Next action</h3><p>Use <b>Datagrid</b> or <b>Compare / Transact</b> to sort relative items by fulfillment, survival value, cost, availability, durability, risk, and evidence.</p></div></div></div>`}
function gridView(n){let r=[...records];r.sort((a,b)=>{let x=a[state.sortField],y=b[state.sortField],nx=parseFloat(x),ny=parseFloat(y);if(!isNaN(nx)&&!isNaN(ny)){x=nx;y=ny}else{x=String(x||'');y=String(y||'')}return(x>y?1:x<y?-1:0)*(state.sortAsc?1:-1)});return `<div class=card><h2>Sortable Comparator Datagrid — ${esc(n.label)}</h2><p>Click any column header to sort relative items by fulfillment and value.</p><table class=table><thead><tr>${cols.map(c=>`<th data-f='${c.field}'>${esc(c.label)} ${state.sortField===c.field?(state.sortAsc?'▲':'▼'):''}</th>`).join('')}</tr></thead><tbody>${r.map(row=>`<tr>${cols.map(c=>`<td>${esc(row[c.field]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function renderInspector(){let n=sel();document.getElementById('inspector').innerHTML=`<div class=card><span class=tag>${esc((n.type||'object').toUpperCase())}</span><h2>${esc(n.label)}</h2><table class=props><tr><td>Priority Rank</td><td>${esc(n.priority_rank||'')}</td></tr><tr><td>Sector</td><td>${esc(state.sector)}</td></tr><tr><td>Scope</td><td>${esc(state.scope)}</td></tr><tr><td>Overlay</td><td>${esc(state.overlay)}</td></tr><tr><td>Tool</td><td>${esc(state.mode)}</td></tr><tr><td>Description</td><td>${esc(n.description||'')}</td></tr></table></div>`}
function renderBottom(){let n=sel();document.getElementById('ctx').innerHTML=`<b>Sector:</b> ${esc(state.sector)}<br><b>Scope:</b> ${esc(state.scope)}<br><b>Overlay:</b> ${esc(state.overlay)}<br><b>Tool:</b> ${esc(state.mode)}`;document.getElementById('summary').innerHTML=`<span class=ok>TREE</span> | ${cnt()} nodes<br><span class=ok>SOURCES</span> | ${sources.length} source records<br><span class=ok>SELECTED</span> | ${esc(n.label)}`;document.getElementById('events').innerHTML='<span class=ok>!</span> Human needs tree is ordered most important to least important.<br><span class=ok>!</span> Datagrid supports sortable value comparison.';document.getElementById('evidence').innerHTML='<span class=ok>✓</span> v2.10.8 modular package with source inventory and priority tree.'}
async function init(){let cfg=await j('data/app/app_config.json',{});if(cfg.app_title)document.getElementById('appTitle').textContent=cfg.app_title;ribbon=await j('data/app/context_ribbon.json',{});nodes=await j('data/app/tree_nodes.json',[]);sources=await j('data/app/source_inventory.json',[]);records=await j('data/app/sample_records.json',[]);cols=await j('data/app/datagrid_columns.json',[]);tree=build(nodes);render()}document.getElementById('filter').oninput=renderTree;document.getElementById('expandBtn').onclick=()=>{function all(n){state.expanded.add(n.node_id);(n.children||[]).forEach(all)}all(tree);renderTree()};document.getElementById('collapseBtn').onclick=()=>{state.expanded=new Set(['home','human','human_needs']);renderTree()};document.getElementById('openNeeds').onclick=()=>{state.mode='Swimlane';state.sector='Human / Consumer';state.selectedId='human_needs';state.expanded.add('home');state.expanded.add('human');state.expanded.add('human_needs');render()};document.getElementById('openGrid').onclick=()=>{state.mode='Datagrid';render()};document.getElementById('expandSources').onclick=()=>{['home','business','business_catalog_conversion_sources','catalog_priority','catalog_industrial','catalog_stats','catalog_reference'].forEach(x=>state.expanded.add(x));render()};document.getElementById('clear').onclick=()=>{state.selectedId='human_needs';state.sector='Human / Consumer';render()};document.getElementById('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({state:{...state,expanded:[...state.expanded]},tree_nodes:nodes,sources,records,cols},null,2)],{type:'application/json'}));a.download='economy_master_workspace_v2_10_7.json';a.click()};document.addEventListener('click',e=>{if(e.target.tagName==='TH'&&e.target.dataset.f){let f=e.target.dataset.f;if(state.sortField===f)state.sortAsc=!state.sortAsc;else{state.sortField=f;state.sortAsc=true}renderWork()}});init();
</script></body></html>
