const data={"sources": [{"source_id": "OPEN_FOOD_FACTS_API_CANADA_SAMPLE", "name": "Open Food Facts Canada API sample", "domain": "food_grocery_barcode", "access_method": "public_api", "url": "https://world.openfoodfacts.org/api/v2/search", "default_mode": "sample_pages", "enabled_by_default": true, "expected_output": "normalized/open_food_facts_canada_sample.csv", "notes": "Pulls pages of Canadian product records through the Open Food Facts API. Full bulk dump is configured separately because it is very large."}, {"source_id": "OPEN_FOOD_FACTS_BULK_JSONL", "name": "Open Food Facts full JSONL bulk dump", "domain": "food_grocery_barcode", "access_method": "open_bulk_download_large", "url": "https://static.openfoodfacts.org/data/openfoodfacts-products.jsonl.gz", "default_mode": "disabled_large", "enabled_by_default": false, "expected_output": "raw/openfoodfacts-products.jsonl.gz", "notes": "Multi-GB compressed. Do not commit raw file to GitHub. Use local storage, release assets or processed summaries."}, {"source_id": "NVD_CPE_DICTIONARY", "name": "NIST NVD Official CPE Dictionary", "domain": "computer_it_product_identity", "access_method": "public_bulk_download", "url": "https://nvd.nist.gov/feeds/xml/cpe/dictionary/official-cpe-dictionary_v2.3.xml.gz", "fallback_url": "https://nvd.nist.gov/feeds/xml/cpe/dictionary/official-cpe-dictionary_v2.3.xml.zip", "default_mode": "download_and_parse_sample", "enabled_by_default": true, "expected_output": "normalized/nvd_cpe_dictionary_sample.csv", "notes": "Official vendor/product/version identifiers. Parser samples first N CPE items by default."}, {"source_id": "ENERGY_STAR_COMPUTERS", "name": "ENERGY STAR Certified Computers V9.0", "domain": "computer_it_appliances", "access_method": "public_socrata_csv", "url": "https://data.energystar.gov/resource/rxdj-2c88.csv?$limit=50000", "default_mode": "download_csv", "enabled_by_default": true, "expected_output": "normalized/energy_star_computers.csv", "notes": "Certified computer product records with brand/model/specification fields from ENERGY STAR Socrata endpoint."}, {"source_id": "ENERGY_STAR_REFRIGERATORS", "name": "ENERGY STAR Certified Residential Refrigerators", "domain": "appliances", "access_method": "public_socrata_csv", "url": "https://data.energystar.gov/resource/p5st-her9.csv?$limit=50000", "default_mode": "download_csv", "enabled_by_default": true, "expected_output": "normalized/energy_star_refrigerators.csv", "notes": "Certified refrigerator/freezer product records from ENERGY STAR Socrata endpoint."}, {"source_id": "NHTSA_VPIC_ALL_MAKES", "name": "NHTSA vPIC GetAllMakes", "domain": "vehicles_auto_reference", "access_method": "public_csv_api", "url": "https://vpic.nhtsa.dot.gov/api/vehicles/GetAllMakes?format=csv", "default_mode": "download_csv", "enabled_by_default": true, "expected_output": "normalized/nhtsa_vpic_all_makes.csv", "notes": "Open vehicle make reference layer, not a parts catalog."}, {"source_id": "FASTENAL_FASTENER_REFERENCE_GUIDE", "name": "Fastenal Fastener Reference Guide PDF", "domain": "tools_fasteners_hardware", "access_method": "public_pdf_download", "url": "https://www.fastenal.com/content/merch_rules/images/fcom/content-library/Fastener%20Reference%20Guide.pdf", "default_mode": "download_pdf_only", "enabled_by_default": true, "expected_output": "raw/Fastenal_Fastener_Reference_Guide.pdf", "notes": "Technical fastener facts. Table parsing/normalization should be separate phase."}, {"source_id": "ACCURIDE_DRAWER_SLIDE_CATALOG", "name": "Accuride Drawer Slide Wood Catalog PDF", "domain": "cabinet_hardware_drawer_slides", "access_method": "public_pdf_download", "url": "https://www.accuride.com/media/pdf/accuride-drawer-slide-wood-catalog-2018.pdf", "default_mode": "download_pdf_only", "enabled_by_default": true, "expected_output": "raw/Accuride_Drawer_Slide_Wood_Catalog_2018.pdf", "notes": "Drawer slide models/capacity/specs. Table parsing/normalization should be separate phase."}], "account_sources": [{"source_id": "BEST_BUY_PRODUCTS_API", "required_key": "BESTBUY_API_KEY", "url": "https://developer.bestbuy.com/apis", "notes": "Full products API for over one million current/historical products; pricing/specs/images."}, {"source_id": "CANADIAN_TIRE_DEVELOPER", "required_key": "CANADIAN_TIRE_API_KEY", "url": "https://developer.cantire.com/", "notes": "Canadian Tire API portal; requires developer registration/access key."}, {"source_id": "NEWARK_PRODUCT_SEARCH_API", "required_key": "E14_API_KEY", "url": "https://partner.element14.com/docs", "notes": "Newark/element14 product search API."}, {"source_id": "LOWES_PRODUCT_CATALOG_API", "required_key": "LOWES_API_KEY", "url": "https://developer.lowes.com/portal/business-components/Product%20Catalog/", "notes": "Lowe's product catalog API; access path."}, {"source_id": "STAPLES_EPROCUREMENT", "required_key": "BUSINESS_ACCOUNT_OR_PUNCHOUT", "url": "https://www.staplesadvantage.com/learn/eprocurement-integrations", "notes": "Staples PunchOut/eProcurement/catalog integration."}, {"source_id": "GS1_CANADA_ECCNET", "required_key": "GS1_CANADA_ACCESS", "url": "https://gs1ca.org/content-access/", "notes": "Canadian product identity/content/image registry access."}, {"source_id": "INGRAM_MICRO_FEEDS", "required_key": "INGRAM_RESELLER_ACCESS", "url": "https://developer.ingrammicro.com/reseller/api-documentation/United_States", "notes": "IT distributor APIs and flat files."}, {"source_id": "TD_SYNNEX_APIS", "required_key": "TD_SYNNEX_ACCESS", "url": "https://www.tdsynnex.com/ion/v3api/", "notes": "IT distributor product APIs."}], "pdf_queue": [{"source_id": "FASTENAL_FASTENER_REFERENCE_GUIDE", "normalized_target": "fastenal_fastener_reference_tables.csv", "parse_priority": 1, "notes": "Extract mechanical properties, grade tables, fastener specs."}, {"source_id": "ACCURIDE_DRAWER_SLIDE_CATALOG", "normalized_target": "accuride_drawer_slide_models.csv", "parse_priority": 1, "notes": "Extract model, extension, load rating, mounting, length function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function table(id,rows){const el=document.getElementById(id);const k=Object.keys(rows[0]);el.innerHTML='<tr>'+k.map(x=>`<th>${esc(x)}</th>`).join('')+'</tr>'+rows.map(r=>'<tr>'+k.map(x=>{const v=r[x];return `<td>${String(v).startsWith('http')?'<a href="'+esc(v)+'" target="_blank">open</a>':esc(v)}</td>`}).join('')+'</tr>').join('')}
table('sources',data.sources);table('accounts',data.account_sources);table('pdfs',data.pdf_queue);
